mission_manager:
  ros__parameters:
    auto_start: false
    update_rate_hz: 10.0
    position_gain: 0.7
    max_horizontal_speed_m_s: 1.5
    max_vertical_speed_m_s: 0.7
    position_tolerance_m: 0.35
    altitude_tolerance_m: 0.25
    pose_timeout_s: 1.0
    service_timeout_s: 10.0
    prearm_timeout_s: 60.0
    prearm_retry_period_s: 1.0

    # Visual landing controller. Dock offsets arrive in the downward camera's
    # optical frame and are converted to body-frame velocity commands.
    dock_pose_timeout_s: 0.5
    dock_acquire_timeout_s: 20.0
    dock_horizontal_gain: 0.7
    dock_max_horizontal_speed_m_s: 0.5
    dock_coarse_tolerance_m: 0.20
    dock_fine_tolerance_m: 0.07
    dock_alignment_stable_time_s: 1.0
    dock_central_transition_distance_m: 1.50
    dock_outer_descent_speed_m_s: 0.30
    dock_central_descent_speed_m_s: 0.12
    dock_land_switch_distance_m: 0.55
    # Warning thresholds only: neither one aborts LAND or stops target data.
    dock_land_timeout_s: 30.0
    dock_disarm_timeout_s: 20.0

    # Landing implementation selected by the launch argument: "ros" keeps
    # alignment/descent in this node; "ardupilot" sends MAVLink
    # LANDING_TARGET and switches to LAND after the stream is stable.
    landing_backend: ros
    landing_target_warmup_s: 1.0
    landing_target_bind_address: 0.0.0.0
    landing_target_udp_port: 14551
    landing_target_source_system: 254
    landing_target_source_component: 191
    # Camera origin relative to base_link in MAVLink Body-FRD.
    landing_target_camera_forward_m: 0.0
    landing_target_camera_right_m: 0.0
    landing_target_camera_down_m: 0.14

    prearm_service: /ap/v1/prearm_check
    mode_service: /ap/v1/mode_switch
    arm_service: /ap/v1/arm_motors
    takeoff_service: /ap/v1/experimental/takeoff
    get_parameters_service: /ap/v1/get_parameters
    pose_topic: /ap/v1/pose/filtered
    status_topic: /ap/v1/status
    velocity_topic: /ap/v1/cmd_vel
    dock_pose_topic: /dock/pose
    dock_mode_topic: /dock/mode
