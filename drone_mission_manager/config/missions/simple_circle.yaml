mission:
  name: simple_circle_precision_land
  type: circle

  coordinates:
    # Absolute coordinates in ArduPilot's local ROS ENU map frame.
    reference: map

  # All positions are metres in ArduPilot's local ROS ENU map frame.
  takeoff:
    altitude_m: 5.0

  circle:
    center_x_m: 5.0
    center_y_m: 0.0
    radius_m: 3.0
    speed_m_s: 1.0
    laps: 1.0
    clockwise: false

  return:
    # The simulated dock is fixed at the local origin. This is the coarse approach
    # point used before the camera-guided landing begins.
    dock_x_m: 0.0
    dock_y_m: 0.0
    hover_altitude_m: 5.0

  precision_landing:
    enabled: true
