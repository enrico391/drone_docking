mission:
  name: dock_circle_precision_land
  type: dock_circle

  coordinates:
    # Horizontal values are offsets from the pose captured before arming. When
    # the simulator starts the drone on the dock, (0, 0) remains the dock even
    # if the station is moved to another world position.
    reference: initial_pose

  takeoff:
    altitude_m: 4.0

  circle:
    # A dock_circle always derives its center from mission.return.dock_*.
    radius_m: 2.0
    speed_m_s: 0.8
    laps: 1.0
    clockwise: false

  return:
    dock_x_m: 0.0
    dock_y_m: 0.0
    hover_altitude_m: 4.0

  precision_landing:
    enabled: true

  repeat:
    # Total number of complete takeoff-circle-land cycles. Increase this value
    # to repeat the mission; one keeps the original single-cycle behavior.
    count: 1
    # Time for the vehicle and autopilot to settle after automatic disarm.
    delay_s: 3.0
