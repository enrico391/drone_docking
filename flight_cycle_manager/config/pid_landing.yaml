flight_cycle_manager:
  ros__parameters:
    pid_tag_stable_time_s: 0.5
    pid_central_transition_distance_m: 1.6
    pid_central_acquire_timeout_s: 6.0
    pid_central_loss_grace_s: 1.0 # used in update descend central 
    pid_recovery_climb_m: 0.3
    pid_recovery_altitude_tolerance_m: 0.05
    pid_max_recovery_attempts: 10
    
    # Minimum distance setpoint during approach; final descent requires commitment.
    pid_touchdown_commit_height_m: 0.35
    # Initial stopping-model assumptions; validate against vertical response logs.
    # Response time covers image/filter/vehicle delay; pose receipt age is added.
    pid_approach_vertical_response_time_s: 0.5
    pid_approach_braking_accel_m_s2: 0.5
    # Arrival band around the approach height; debug hold targets the exact height.
    pid_approach_height_tolerance_m: 0.02
    pid_touchdown_speed_m_s: 0.15
    pid_touchdown_timeout_s: 15.0
    pid_landed_state_timeout_s: 1.0
    pid_landed_stable_time_s: 0.5
    pid_disarm_retry_period_s: 1.0
    pid_alignment_stable_time_s: 1.0

    # Tolerance for the PID controller to consider the vehicle aligned with the target during OUTER and CENTRAL descend.
    pid_outer_horizontal_tolerance_m: 0.25
    pid_central_horizontal_tolerance_m: 0.07
    pid_outer_yaw_tolerance_rad: 0.6
    pid_central_yaw_tolerance_rad: 0.2
    # Stricter alignment required continuously before committing to touchdown.
    pid_touchdown_horizontal_tolerance_m: 0.03
    pid_touchdown_yaw_tolerance_rad: 0.1
    # Maximum measured horizontal speed throughout fine-alignment dwell before touchdown.
    pid_touchdown_horizontal_speed_tolerance_m_s: 0.07
    # Require continuous low horizontal speed for this many seconds before touchdown.
    pid_touchdown_horizontal_speed_stable_time_s: 0.5

    # Speed limits for the PID controller during landing.
    pid_max_horizontal_speed_m_s: 0.6 # PID_ALIGN; X/Y PID output range covers all stages
    pid_descend_outer_max_horizontal_speed_m_s: 0.6
    pid_descend_central_max_horizontal_speed_m_s: 0.30
    pid_touchdown_max_horizontal_speed_m_s: 0.12
    pid_outer_descent_speed_m_s: 0.30
    pid_central_descent_speed_m_s: 0.20
    pid_recovery_speed_m_s: 0.20
    pid_max_yaw_rate_rad_s: 0.35

    pid_target_loss_grace_s : 4.0
    # Gains interpolate between 0.6 m and 6.0 m; -1 inherits pid_<axis>_<gain>.
    pid_gain_near_distance_m: 1.0 # min 
    pid_gain_far_distance_m: 6.0 # max

    # defult values for near to dock distance
    pid_gain_near_x_kp: -1.0
    pid_gain_near_x_ki: -1.0
    pid_gain_near_x_kd: -1.0
    pid_gain_near_y_kp: -1.0
    pid_gain_near_y_ki: -1.0
    pid_gain_near_y_kd: -1.0
    
    # for z I use -1 to inherit the default values
    pid_gain_near_z_kp: -1.0
    pid_gain_near_z_ki: -1.0
    pid_gain_near_z_kd: -1.0
    # for z I use -1 to inherit the default values
    pid_gain_near_yaw_kp: -1.0
    pid_gain_near_yaw_ki: -1.0
    pid_gain_near_yaw_kd: -1.0

    # at 6.0 m I use different gains for x and y to have stability
    pid_gain_far_x_kp: 0.18
    pid_gain_far_x_ki: 0.01
    pid_gain_far_x_kd: 0.1
    pid_gain_far_y_kp: 0.18
    pid_gain_far_y_ki: 0.01
    pid_gain_far_y_kd: 0.1

    # for z I use -1 to inherit the default values
    pid_gain_far_z_kp: -1.0
    pid_gain_far_z_ki: -1.0
    pid_gain_far_z_kd: -1.0
    # for yaw I use -1 to inherit the default values
    pid_gain_far_yaw_kp: -1.0
    pid_gain_far_yaw_ki: -1.0
    pid_gain_far_yaw_kd: -1.0

    # Default PID gains
    # ONLY P or PD control is used for X/Y/Z because possible conflict with the position controller.
    # Measured-velocity damping: v_cmd = v_pid - pid_<axis>_k_v * v_mea.
    pid_x_k_v: 0.0
    pid_y_k_v: 0.0
    pid_z_k_v: 0.0

    pid_x_kp: 0.60
    pid_x_ki: 0.01
    pid_x_kd: 0.00
    pid_x_integral_limit: 0.1
    pid_x_derivative_filter_time_constant_s: 0.1
    pid_y_kp: 0.60
    pid_y_ki: 0.01
    pid_y_kd: 0.00
    pid_y_integral_limit: 0.1
    pid_y_derivative_filter_time_constant_s: 0.1
    pid_z_kp: 0.60
    pid_z_ki: 0.01
    pid_z_kd: 0.00
    pid_z_integral_limit: 0.5
    pid_z_derivative_filter_time_constant_s: 0.1
    pid_yaw_kp: 0.60
    pid_yaw_ki: 0.0
    pid_yaw_kd: 0.0
    pid_yaw_integral_limit: 0.5
    pid_yaw_derivative_filter_time_constant_s: 0.1
